name: Notify Issue Agent

on:
  issues:
    types: [opened]

# No GitHub API access is needed: the request is authenticated with
# ISSUE_AGENT_API_KEY and the payload is read from the event context.
permissions: {}

jobs:
  notify-issue-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch issue to Analitiq issue-agent
        env:
          API_URL: ${{ vars.ANALITIQ_WEBHOOK_NEW_ISSUE }}
          API_KEY: ${{ secrets.ISSUE_AGENT_API_KEY }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ -z "${API_URL:-}" ]; then
            echo "::error::Org variable ANALITIQ_WEBHOOK_NEW_ISSUE is not set."
            exit 1
          fi
          if [ -z "${API_KEY:-}" ]; then
            echo "::error::Org secret ISSUE_AGENT_API_KEY is not set."
            exit 1
          fi

          # Build the payload with jq so issue_number stays a JSON integer and the
          # strings are escaped correctly. Exactly three keys: the API gateway model
          # is additionalProperties:false, so any extra field is rejected with a 400.
          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --argjson issue_number "$ISSUE_NUMBER" \
            --arg base_branch "$BASE_BRANCH" \
            '{repo: $repo, issue_number: $issue_number, base_branch: $base_branch}')

          echo "Dispatching: $PAYLOAD"

          MAX_ATTEMPTS=3
          attempt=1
          while :; do
            HTTP_CODE=$(curl --silent --show-error \
              -o response_body.txt \
              -D response_headers.txt \
              -w '%{http_code}' \
              -X POST "$API_URL" \
              -H "x-api-key: $API_KEY" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" || true)

            BODY=$(cat response_body.txt 2>/dev/null || true)

            case "$HTTP_CODE" in
              202)
                echo "✅ 202 — job submitted."
                echo "$BODY"
                exit 0
                ;;
              200)
                echo "✅ 200 — a job for this repo+issue is already active (dedup, no-op)."
                echo "$BODY"
                exit 0
                ;;
              429)
                RETRY_AFTER=$(grep -i '^retry-after:' response_headers.txt | tail -n1 | awk '{print $2}' | tr -d '\r')
                RETRY_AFTER=${RETRY_AFTER:-120}
                if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
                  echo "::error::429 — concurrency cap of 10 reached; retries exhausted after $attempt attempts."
                  echo "$BODY"
                  exit 1
                fi
                echo "::warning::429 — concurrency cap reached. Retrying in ${RETRY_AFTER}s (attempt $attempt/$MAX_ATTEMPTS)."
                sleep "$RETRY_AFTER"
                attempt=$((attempt + 1))
                ;;
              400)
                echo "::error::400 — payload failed schema validation."
                echo "$BODY"
                exit 1
                ;;
              403)
                echo "::error::403 — bad or missing API key (ISSUE_AGENT_API_KEY)."
                echo "$BODY"
                exit 1
                ;;
              *)
                echo "::error::Issue-agent dispatch failed with HTTP ${HTTP_CODE:-000}."
                echo "$BODY"
                exit 1
                ;;
            esac
          done
